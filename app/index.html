<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON PALMS — Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <aside class="controls" id="controls">
    <header>
      <h1>NEON PALMS</h1>
      <p class="tag">Cover Studio — photo + caption, poster art out.</p>
    </header>

    <section>
      <h2>1 · Photos</h2>
      <div class="samples" id="samples"></div>
      <label class="upload">Upload your own photo
        <input id="uploadInput" type="file" accept="image/*">
      </label>
      <label class="check"><input id="fillAllToggle" type="checkbox"> One photo fills all panels</label>
    </section>

    <section>
      <h2>2 · Layout</h2>
      <div class="pills" id="layoutPills"></div>
    </section>

    <section>
      <h2>3 · Grade</h2>
      <div class="pills" id="gradePills"></div>
      <label>Per-panel grade
        <select id="panelGrade"></select>
      </label>
    </section>

    <section>
      <h2>4 · Lettering</h2>
      <label>Title <input id="titleInput" type="text" maxlength="24" value="NEON PALMS"></label>
      <label>Subtitle <input id="subtitleInput" type="text" maxlength="48" value="golden hour in Neon Bay"></label>
      <label>Badge <input id="badgeInput" type="text" maxlength="28" value="EST. 2026 · NEON BAY"></label>
      <label>Tagline <input id="taglineInput" type="text" maxlength="48" value="ONE CITY. EVERY SUNSET A STAGE."></label>
      <label>Heat <input id="heatInput" type="range" min="0" max="5" step="1" value="4"></label>
    </section>

    <section>
      <h2>5 · Selected panel</h2>
      <p class="hint" id="panelLabel">Panel 1 — drag to pan · zoom / rotate below</p>
      <label>Zoom <input id="zoomSlider" type="range" min="1" max="2.5" step="0.01" value="1"></label>
      <label>Rotate <input id="rotateSlider" type="range" min="-30" max="30" step="1" value="0"></label>
      <div class="row">
        <button id="flipBtn" type="button">Flip</button>
        <button id="undoBtn" type="button">Undo</button>
        <button id="redoBtn" type="button">Redo</button>
        <button id="randomBtn" type="button">Surprise me</button>
      </div>
    </section>

    <section>
      <h2>6 · Finish</h2>
      <label class="check"><input id="grainToggle" type="checkbox" checked> Film grain</label>
      <label class="check"><input id="vignetteToggle" type="checkbox" checked> Vignette</label>
      <label class="check"><input id="halftoneToggle" type="checkbox" checked> Halftone title</label>
      <label class="check"><input id="stickersToggle" type="checkbox" checked> Stickers</label>
      <button id="exportBtn" type="button" class="export">Export all sizes — PNG</button>
      <p class="sizes">1080×1080 · 1080×1350 · 1920×1080, one click.</p>
      <p id="status" role="status"></p>
    </section>
  </aside>

  <section class="stage">
    <canvas id="preview" width="1920" height="1080" aria-label="Live cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
